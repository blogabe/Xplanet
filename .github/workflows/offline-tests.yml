name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Full supported macOS suite
        env:
          TZ: UTC
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export TOTALMARKER_PYTHON="$(command -v python)"
          ./scripts/xplanet.sh test
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Portable data and publication suite
        env:
          TZ: UTC
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: scripts:dev
        run: python -m tests.run_portable

  configurator:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Isolated configurator interactions
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m venv "$RUNNER_TEMP/configurator"
          "$RUNNER_TEMP/configurator/bin/python" -m pip install --require-hashes --only-binary=:all: -r scripts/configurator/requirements.txt
          "$RUNNER_TEMP/configurator/bin/python" -B -m unittest discover -s dev/configurator-tests -v
