name: Offline tests
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Full supported macOS suite
        env:
          TZ: UTC
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export TOTALMARKER_PYTHON="$(command -v python)"
          ./scripts/xplanet.sh test
  configurator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Isolated configurator interactions
        env:
          PYTHONPATH: scripts:.
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m venv "$RUNNER_TEMP/configurator"
          "$RUNNER_TEMP/configurator/bin/python" -m pip install --require-hashes --only-binary=:all: -r scripts/configurator/requirements.txt
          "$RUNNER_TEMP/configurator/bin/python" -B -m unittest discover -s tests/configurator/ui -v
