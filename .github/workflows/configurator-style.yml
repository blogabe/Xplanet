name: Configurator style
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configurator-style:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ruff.toml
            /scripts/configurator/
            /scripts/totalmarker/
            /tests/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Check Configurator formatting and Python lint
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r scripts/configurator/requirements-lint.txt
          ruff format --config ruff.toml --check scripts/configurator tests/configurator
          ruff check --config ruff.toml scripts/configurator scripts/totalmarker tests
