# Example only. Keep personal config/totalmarker.toml separate; never overwrite it.
# The selected .invalid custom source cannot be fetched; choose sources deliberately.
# Timing fields use the whole unit named in their key; network timeouts use seconds.
# The scheduler (such as a launchd plist) decides when TotalMarker runs.
# check_interval_* is the minimum time between fetches when saved data can
# still be reused. It does not change the scheduler. The example intervals
# allow some launchd start jitter.

[paths]
# Relative paths resolve against --root, not this file or the current directory.
image = "images/{local_image_name}"
labels = "markers/updatelabel"
log = "logs/totalmarker/events.jsonl"

[labels]
# Product operations refresh existing rows and retain their coordinates/order.
enabled = true
warning_cloud_hours = 6
warning_quake_hours = 3
warning_storm_hours = 3
warning_volcano_days = 3
warning_norad_days = 1

[labels.colors]
ok = "Green"
warning = "Yellow"
error = "Red"

[cloud]
# Custom is a placeholder here. Xeric requires its fixed HTTPS origin and
# basic credentials in [cloud.xeric] or corresponding environment references.
provider = "custom"
resolution = 4096
local_image_name_template = "clouds-{resolution}.jpg"
check_interval_minutes = 55
timeout_seconds = 30

[cloud.xeric]
# Inactive while custom is selected. Use credentials or environment references
# only after deliberately selecting Xeric in [cloud].
url_template = "https://secure.xericdesign.com/xplanet/clouds/{resolution}/clouds-{resolution}.jpg"
auth_mode = "basic"
username = ""
password = ""
username_env = ""
password_env = ""

[cloud.custom]
url_template = "https://cloud.example.invalid/clouds-{resolution}.jpg"
auth_mode = "none"
# Leave credentials empty with auth_mode = "none".
username = ""
password = ""
username_env = ""
password_env = ""

# NOAA OVATION aurora. New configurations enable it; absent means disabled.
# Set this to your original image or symlink, never to the derived night-current.
[aurora]
enabled = true
base_night_map = "maps/lights/earth_lights_4800.tiff"

[quake]
# Day/Week/Month and All/1.0/2.5/4.5/Significant select USGS GeoJSON.
reporting_duration = "Week"
reporting_size = "All"
minimum_magnitude = 6.0
output = "markers/quake"
check_interval_minutes = 18
timeout_seconds = 30
circle_color = "Multi"
pixel_max = ""
pixel_min = ""
pixel_factor = 1.0
image = ""
# image_transparent options use an RGB color key, e.g. "{0,0,0}"; not opacity.
image_transparent = ""
detail = "<mag>"
detail_color = "Multi"
detail_color_min = "Green"
detail_color_int = "Yellow"
detail_color_max = "Red"
detail_align = "Above"

[storm]
# NHC/JTWC are fixed public sources. Missing or stale source coverage retains
# the last good marker/arc pair.
output = "markers/storm"
arc_output = "arcs/storm"
check_interval_minutes = 30
timeout_seconds = 30
track_real_color = "Blue"
track_forecast_color = "SkyBlue"
name_enabled = true
name_color = "SkyBlue"
name_align = "Above"
detail_align = "Below"
detail = "<type>"
detail_color = "SkyBlue"
image = ""
image_transparent = ""
track_enabled = true

[volcano]
# Auto tries the official CAP feed first and the Weekly Report HTML as fallback.
# Pin "cap" or "weekly_html" to use just one source. A custom URL requires "cap".
# Failed refreshes retain prior markers and the last successful refresh time.
enabled = true
provider = "auto"
url = ""
# url = "https://volcano.si.edu/news/WeeklyVolcanoCAP.xml"
output = "markers/volcano"
check_interval_hours = 23
timeout_seconds = 30
circle_size_inner = 4
circle_size_middle = 8
circle_size_outer = 12
circle_color_inner = "Yellow"
circle_color_middle = "Red"
circle_color_outer = "Brown"
name_enabled = true
name_color = "Brown"
name_align = "Below"
image = ""
image_transparent = ""
detail = ""
detail_align = "Below"
detail_color = "Brown"

[eclipse]
# Optional NASA GSFC central path product. Blank URL discovers the upcoming
# or current central event; a specific total, annular, or hybrid URL overrides.
# Partial-only events have no central path. Xplanet marker_file/arc_file
# references require a separate deliberate operator change.
enabled = false
path_url = ""
marker_output = "markers/eclipse"
arc_output = "arcs/eclipse"
check_interval_hours = 24
timeout_seconds = 30
notify_hours = 48
notice_enabled = true
edge_color = "Grey"
center_color = "Black"
notice_color = "White"

[norad]
# Optional CelesTrak orbital elements. Select up to 16 catalog IDs.
# IDs 100000–339999 require a renderer that reports Alpha-5 in xplanet -version.
# catalog_ids is a comma-separated string, not a TOML array.
# Explicit IDs lead; enabled group matches follow in configuration/source order.
# Duplicate IDs use the first selection, and an ID profile overrides group style.
# Invalid group responses fail. Unsupported IDs are skipped with a warning
# when supported selections remain; an all-unsupported selection
# fails without replacing the last good selector/TLE pair.
# Keep disabled until an operator deliberately configures Xplanet satellite_file.
enabled = false
catalog_ids = "25544"
output = "satellites/totalmarker"
check_interval_hours = 2
timeout_seconds = 30
max_age_days = 14
color = "Yellow"

[[norad.groups]]
# Optional current CelesTrak group discovery. Enable deliberately; a source
# may have no current match. Supported sources: stations, science, visual.
source = "stations"
name_contains = "SOYUZ"
enabled = false
color = "Yellow"

[[norad.profiles]]
# A profile styles a selected ID; it does not fetch that ID by itself.
catalog_id = 25544
enabled = true
caption = "ISS"
color = "Yellow"
trail = [-30, 30, 5]
# icon = "iss.png"       # Require a real local images/iss.png first.
# transparent = [0, 0, 0]
# altcirc = 0
# align = "Above"
